<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientific Journal — website demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>/*__THREE__*/</script>
<style>/*__CSS__*/</style>
</head>
<body>
<canvas id="scene" class="pointer-events-none fixed inset-0 z-0 h-full w-full" aria-hidden="true"></canvas>
<div id="app" class="relative z-10"></div>
<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-full border border-brand-600/40 bg-slate-100 px-5 py-2.5 text-sm text-slate-900 opacity-0 shadow-lg transition-opacity" role="status" aria-live="polite"></div>

<script>
const MESSAGES = /*__MESSAGES__*/;
const SEED = /*__SEED__*/;

/* ---------------------------------------------------------------- state */
const STORE_KEY = "journal-demo-v2";
const EXTRA = {
  uz: { reset: "Demo ma'lumotlarni tiklash", fileNote: "Demo rejimda fayllar saqlanmaydi. Supabase ulangach haqiqiy fayllar yuklanadi.", saved: "Saqlandi", submitted: "Maqola yuborildi", needLogin: "Avval tizimga kiring", sampleSite: "Bu sayt namunasi" , heroKicker: "Xalqaro taqrizlanadigan ochiq jurnal", langsLabel: "Nashr tillari", published: "Nashr etilgan maqolalar", howTitle: "Maqola qanday nashr etiladi",
    steps: [["Yuborish", "Maqolani onlayn yuboring va har bir bosqichini shaxsiy kabinetda kuzating."], ["Taqriz", "Ikki mustaqil taqrizchi yopiq usulda baholaydi, odatda 3–4 hafta."], ["Qaror", "Muharrir qabul qilish, tuzatish yoki rad etish haqida xabar beradi."], ["Nashr", "Maqola DOI bilan ochiq kirishda chiqadi va arxivga qo'shiladi."]] },
  ru: { reset: "Сбросить демо-данные", fileNote: "В демо-режиме файлы не хранятся. После подключения Supabase здесь будут настоящие файлы.", saved: "Сохранено", submitted: "Статья отправлена", needLogin: "Сначала войдите", sampleSite: "Образец сайта" , heroKicker: "Международный рецензируемый журнал открытого доступа", langsLabel: "Языки публикации", published: "Опубликовано статей", howTitle: "Как публикуется статья",
    steps: [["Отправка", "Отправьте статью онлайн и следите за каждым этапом в личном кабинете."], ["Рецензирование", "Два независимых рецензента, двойное слепое рецензирование, обычно 3–4 недели."], ["Решение", "Редактор сообщает: принять, доработать или отклонить."], ["Публикация", "Статья выходит в открытом доступе с DOI и попадает в архив."]] },
  en: { reset: "Reset demo data", fileNote: "Files aren't stored in demo mode. Real files will download here once Supabase is connected.", saved: "Saved", submitted: "Article submitted", needLogin: "Please log in first", sampleSite: "Sample site" , heroKicker: "An international, peer-reviewed, open-access journal", langsLabel: "Publication languages", published: "Published articles", howTitle: "How an article gets published",
    steps: [["Submit", "Send your manuscript online and follow every stage in your account."], ["Peer review", "Two independent reviewers assess it double-blind, usually in 3–4 weeks."], ["Decision", "The editor tells you: accept, revise or reject."], ["Publish", "Your article goes live open access with a DOI and joins the archive."]] },
};
const clone = (x) => JSON.parse(JSON.stringify(x));
let db, S;
(function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  db = saved?.db || clone(SEED);
  S = { theme: saved?.theme || "dark", lang: saved?.lang || "uz", uid: saved?.uid || null, q: "", filter: null, next: null, userQ: "" };
})();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ db, lang: S.lang, uid: S.uid, theme: S.theme })); } catch (e) {}
}

/* -------------------------------------------------------------- helpers */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function t(key, vars = {}) {
  let s = key.split(".").reduce((o, p) => (o == null ? o : o[p]), MESSAGES[S.lang]);
  if (s == null) s = EXTRA[S.lang][key] ?? key;
  for (const [a, b] of Object.entries(vars)) s = s.split("{" + a + "}").join(b);
  return s;
}
const tr = (o) => (o ? o[S.lang] || o.uz || o.en || o.ru || "" : "");
const trx = (o) => (o && o[S.lang]) || "";
const by = (table, id) => db[table].find((r) => r.id === id);
const me = () => (S.uid ? by("profiles", S.uid) : null);
const isStaff = () => ["editor", "admin"].includes(me()?.role);
const now = () => new Date().toISOString();
const newId = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const journal = () => db.journals[0];
function fmtDate(d) {
  if (!d) return "";
  if (S.lang === "uz") {
    const m = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
    const x = new Date(d);
    return `${x.getDate()}-${m[x.getMonth()]}, ${x.getFullYear()}`;
  }
  const tag = S.lang === "ru" ? "ru-RU" : "en-GB";
  try { return new Intl.DateTimeFormat(tag, { year: "numeric", month: "long", day: "numeric" }).format(new Date(d)); } catch (e) { return d.slice(0, 10); }
}
const range = (a, b) => (!a ? "" : b && b !== a ? `${a}–${b}` : String(a));
function issueLabel(i) {
  const v = by("volumes", i.volume_id);
  const parts = [];
  if (v) parts.push(t("archives.volume", { n: v.number, year: v.year }));
  parts.push(i.is_special ? `${t("archives.special")} ${i.number}` : t("archives.issue", { n: i.number }));
  return parts.join(", ");
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.style.opacity = "0"), 2600);
}
const go = (hash) => { if (location.hash === "#" + hash) render(); else location.hash = hash; };
const badge = (s) => `<span class="badge b-${s}">${esc(t("status." + s))}</span>`;
const back = (hash) => `<a href="#${hash}" class="text-sm text-brand-600 hover:underline">← ${esc(t("common.back"))}</a>`;
function setStatus(sub, status, note) {
  const from = sub.status;
  if (status === "submitted" && from !== "submitted") sub.submitted_at = now();
  sub.status = status;
  if (note !== undefined) sub.decision_note = note || null;
  sub.updated_at = now();
  db.submission_events.push({ id: Date.now(), submission_id: sub.id, actor_id: S.uid, from_status: from, to_status: status, note: note || null, created_at: now() });
  if (typeof notify === "function") {
    if (status === "submitted" && S.uid === sub.submitter_id) notify(staffIds(), "new", sub, "admin-sub-" + sub.id);
    else if (S.uid !== sub.submitter_id) notify(sub.submitter_id, "status", sub, "mysub-" + sub.id, status);
  }
}

/* --------------------------------------------------------------- layout */
// Eight-pointed Samarkand star (two squares), used as the logo mark.
function starMark(size = 28, stroke = "#e8b13a") {
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="${stroke}" stroke-width="1.6">
    <rect x="9" y="9" width="22" height="22"/><rect x="9" y="9" width="22" height="22" transform="rotate(45 20 20)"/>
    <circle cx="20" cy="20" r="4.2" stroke="#3cc8bb"/></svg>`;
}
// A generated tile-pattern cover for each issue, so the archive reads like a shelf.
function issueCover(i, size = "md") {
  const v = by("volumes", i.volume_id);
  const hues = [["#0a1d5c", "#3cc8bb"], ["#123a63", "#e8b13a"], ["#0b2c4f", "#79dfd5"], ["#1b1f5e", "#e8b13a"]];
  const [bg, fg] = i.is_special ? ["#2a1846", "#e8b13a"] : hues[(i.number + (v?.number || 0)) % hues.length];
  const id = "p" + i.id.replace(/[^a-z0-9]/gi, "");
  const big = size === "lg";
  const topic = issueTopic(i);
  return `<div class="tilt relative aspect-[3/4] w-full overflow-hidden rounded-xl ring-1 ring-white/10" style="background:${bg}">
    ${topic ? `<p class="absolute left-4 right-4 top-4 z-10 text-xs leading-snug text-[#cdd5e8]">${esc(topic)}</p>` : ""}
    <svg class="absolute inset-0 h-full w-full opacity-60" aria-hidden="true">
      <defs><pattern id="${id}" width="44" height="44" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="${fg}" stroke-width="0.9" opacity="0.55">
          <rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/>
          <path d="M0 22h6M38 22h6M22 0v6M22 38v6"/></g></pattern></defs>
      <rect width="100%" height="100%" fill="url(#${id})"/></svg>
    <div class="absolute inset-0 bg-gradient-to-t from-[#050b22] via-[#050b22]/40 to-transparent"></div>
    <div class="absolute inset-x-0 bottom-0 ${big ? "p-6" : "p-4"}">
      <p class="font-serif ${big ? "text-5xl" : "text-3xl"} font-light leading-none" style="color:${fg}">${i.is_special ? "S" + i.number : i.number}</p>
      <p class="mt-2 text-xs text-[#cdd5e8]">${esc(v ? t("archives.volume", { n: v.number, year: v.year }) : "")}</p>
    </div>
  </div>`;
}
function layout(content) {
  const u = me();
  const pages = db.pages.filter((p) => p.show_in_menu && p.is_published).sort((a, b) => a.sort_order - b.sort_order);
  const langPill = (l) => `<button data-act="setLang" data-l="${l}" aria-pressed="${l === S.lang}" class="rounded-full px-2.5 py-1 text-xs font-semibold transition ${l === S.lang ? "bg-slate-900 text-ink" : "text-slate-600 hover:text-slate-900"}">${l.toUpperCase()}</button>`;
  return `
  <div class="flex min-h-screen flex-col">
    <div class="flex flex-wrap items-center justify-center gap-x-3 border-b border-accent/20 bg-accent/10 px-4 py-1.5 text-center text-xs text-accent">
      <span>${esc(t("demo.banner"))}</span><button data-act="reset" class="underline underline-offset-2">${esc(t("reset"))}</button>
    </div>
    <header class="sticky top-0 z-40 border-b border-white/5 bg-slate-50/70 backdrop-blur-xl">
      <div class="mx-auto flex max-w-7xl items-center gap-6 px-5 py-3">
        <a href="#home" class="flex shrink-0 items-center gap-3">
          ${logoMark(30)}
          <span class="font-serif text-lg tracking-tight text-slate-900">${esc(tr(journal().title))}</span>
        </a>
        <nav class="hidden flex-1 items-center gap-5 whitespace-nowrap text-sm xl:flex" aria-label="Main">
          <a href="#current" class="navlink">${esc(t("nav.current"))}</a>
          <a href="#archives" class="navlink">${esc(t("nav.archives"))}</a>
          <a href="#board" class="navlink">${esc(t("nav.board"))}</a>
          <a href="#news" class="navlink">${esc(t("news"))}</a>
          ${pages.slice(0, u ? 0 : 2).map((p) => `<a href="#page-${esc(p.slug)}" class="navlink">${esc(tr(p.title))}</a>`).join("")}
          <a href="#search" class="navlink" aria-label="${esc(t("nav.search"))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
        </nav>
        <div class="ml-auto flex items-center gap-3 whitespace-nowrap">
          <div data-bell>${bell()}</div>
          ${themeButton()}
          <div class="flex rounded-full border border-slate-200 p-0.5" role="group" aria-label="Language">${["uz", "ru", "en"].map(langPill).join("")}</div>
          ${u ? `
            ${isStaff() ? `<a href="#admin" class="navlink hidden text-sm sm:inline">${esc(t("nav.admin"))}</a>` : ""}
            <a href="#dashboard" class="navlink hidden text-sm sm:inline">${esc(t("nav.dashboard"))}</a>
            <button data-act="logout" class="navlink p-1" aria-label="${esc(t("nav.logout"))}" title="${esc(t("nav.logout"))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg></button>
          ` : `<a href="#login" class="navlink text-sm">${esc(t("nav.login"))}</a>`}
          <a href="#submit" class="btn-gold hidden sm:inline-flex">${esc(t("nav.submit"))}</a>
        </div>
      </div>
      <nav class="flex gap-5 overflow-x-auto whitespace-nowrap border-t border-white/5 px-5 py-2 text-sm xl:hidden" aria-label="Main mobile">
        <a href="#current" class="navlink shrink-0">${esc(t("nav.current"))}</a>
        <a href="#archives" class="navlink shrink-0">${esc(t("nav.archives"))}</a>
        <a href="#board" class="navlink shrink-0">${esc(t("nav.board"))}</a>
        <a href="#news" class="navlink shrink-0">${esc(t("news"))}</a>
        ${pages.map((p) => `<a href="#page-${esc(p.slug)}" class="navlink shrink-0">${esc(tr(p.title))}</a>`).join("")}
        <a href="#search" class="navlink shrink-0">${esc(t("nav.search"))}</a>
        <a href="#submit" class="shrink-0 font-semibold text-accent">${esc(t("nav.submit"))}</a>
      </nav>
    </header>
    <main class="flex-1"><div id="page" class="${S.route === "home" ? "" : "mx-auto w-full max-w-7xl px-5 py-10"}">${content}</div></main>
    <footer class="relative mt-24 border-t border-white/5 bg-slate-50/80 backdrop-blur">
      <div class="mx-auto grid max-w-7xl gap-10 px-5 py-14 md:grid-cols-[1.4fr_1fr_1fr]">
        <div>
          <div class="flex items-center gap-3">${logoMark(34)}<span class="font-serif text-xl text-slate-900">${esc(tr(journal().title))}</span></div>
          <p class="mt-4 max-w-sm text-sm leading-relaxed text-slate-500">${esc(tr(journal().description))}</p>
        </div>
        <ul class="space-y-2 text-sm">
          <li><a href="#archives" class="navlink">${esc(t("nav.archives"))}</a></li>
          <li><a href="#board" class="navlink">${esc(t("nav.board"))}</a></li>
          <li><a href="#news" class="navlink">${esc(t("news"))}</a></li>
          ${pages.map((p) => `<li><a href="#page-${esc(p.slug)}" class="navlink">${esc(tr(p.title))}</a></li>`).join("")}
        </ul>
        <div class="space-y-2 text-sm text-slate-500">
          <p>ISSN ${esc(journal().issn_online)} (online)</p>
          <p>${esc(journal().publisher)}</p>
          <p>${esc(t("footer.license"))}</p>
          <p>© 2026 ${esc(t("footer.rights"))}</p>
        </div>
      </div>
    </footer>
  </div>`;
}

/* ------------------------------------------------------------ home page */
function viewHome() {
  const j = journal();
  const cur = publishedIssues()[0];
  const steps = EXTRA[S.lang].steps;
  const total = db.articles.filter((a) => a.status === "published").length;
  return `
  <section class="relative mx-auto flex min-h-[calc(100vh-7rem)] max-w-7xl items-center px-5 pb-16 pt-10">
    <div class="max-w-2xl">
      <h1 class="reveal font-serif text-[clamp(2.75rem,7vw,5.75rem)] font-light leading-[0.98] tracking-[-0.03em] text-slate-900" style="animation-delay:.35s">${esc(tr(j.title))}</h1>
      <p class="reveal mt-7 max-w-xl text-lg leading-relaxed text-slate-600" style="animation-delay:.55s">${esc(tr(j.description))}</p>
      <div class="reveal mt-9 flex flex-wrap gap-3" style="animation-delay:.7s">
        <a href="#submit" class="btn-gold px-7 py-3 text-base">${esc(t("home.cta"))}</a>
        ${cur ? `<a href="#issue-${cur.id}" class="btn-secondary px-7 py-3 text-base">${esc(t("nav.current"))}</a>` : ""}
      </div>
      <dl class="reveal mt-14 flex flex-wrap gap-x-10 gap-y-4 text-sm" style="animation-delay:.9s">
        <div><dt class="text-slate-500">${esc(EXTRA[S.lang].langsLabel)}</dt><dd class="mt-1 text-slate-900">O'zbek, Русский, English</dd></div>
        <div><dt class="text-slate-500">${esc(EXTRA[S.lang].published)}</dt><dd class="mt-1 text-slate-900">${total}</dd></div>
        <div><dt class="text-slate-500">ISSN</dt><dd class="mt-1 text-slate-900">${esc(j.issn_online)}</dd></div>
      </dl>
    </div>
    <a href="#home-current" data-act="scrollTo" data-target="home-current" class="absolute bottom-6 left-1/2 hidden -translate-x-1/2 text-slate-500 transition hover:text-slate-900 md:block" aria-label="${esc(t("home.currentIssue"))}">
      <svg width="22" height="34" viewBox="0 0 22 34" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1" y="1" width="20" height="32" rx="10"/><path d="M11 8v6" class="animate-bounce"/></svg>
    </a>
  </section>

  ${indexStrip()}
  ${cur ? `<section id="home-current" class="mx-auto max-w-7xl scroll-mt-24 px-5 py-16">
    <div class="grid gap-10 lg:grid-cols-[300px_1fr]">
      <div class="lg:sticky lg:top-28 lg:self-start">
        <a href="#issue-${cur.id}" class="block">${issueCover(cur, "lg")}</a>
        <h2 class="mt-6 text-2xl">${esc(t("home.currentIssue"))}</h2>
        <p class="mt-2 text-sm text-slate-500">${esc(issueLabel(cur))}<br>${esc(fmtDate(cur.published_at))}</p>
        <a href="#issue-${cur.id}" class="mt-4 inline-block text-sm font-semibold text-brand-700 hover:underline">${esc(t("home.viewIssue"))}</a>
      </div>
      <div class="card p-2 sm:p-4">${articleList(issueArticles(cur.id))}</div>
    </div>
  </section>` : ""}

  ${cfpCard()}
  ${numbersBlock()}
  <section class="mx-auto max-w-7xl px-5 py-16">
    <h2 class="max-w-xl text-3xl leading-tight sm:text-4xl">${esc(EXTRA[S.lang].howTitle)}</h2>
    <ol class="mt-12 grid gap-px overflow-hidden rounded-2xl border border-slate-200 bg-slate-200 sm:grid-cols-2 lg:grid-cols-4">
      ${steps.map(([h, p], i) => `<li class="step bg-slate-50/85 p-7 backdrop-blur" style="transition-delay:${i * 140}ms">
        <span class="step-num font-serif text-4xl font-light text-accent">${i + 1}</span>
        <h3 class="mt-6 text-lg">${esc(h)}</h3>
        <p class="mt-2 text-sm leading-relaxed text-slate-500">${esc(p)}</p>
      </li>`).join("")}
    </ol>
    <div class="mt-10 flex flex-wrap items-center gap-4">
      <a href="#submit" class="btn-primary px-6 py-3">${esc(t("home.cta"))}</a>
      <a href="#page-author-guidelines" class="text-sm font-semibold text-brand-700 hover:underline">${esc(t("nav.forAuthors"))}</a>
    </div>
  </section>
  ${newsBlock()}`;
}

function viewArchives() {
  const vols = db.volumes.slice().sort((a, b) => b.number - a.number)
    .map((v) => ({ v, issues: db.issues.filter((i) => i.volume_id === v.id && i.status === "published").sort((a, b) => b.number - a.number || a.is_special - b.is_special) }))
    .filter((x) => x.issues.length);
  return `<div>
    <h1 class="text-4xl sm:text-5xl font-light">${esc(t("archives.title"))}</h1>
    ${!vols.length ? `<p class="mt-6 text-slate-500">${esc(t("archives.empty"))}</p>` : ""}
    <div class="mt-12 space-y-14">${vols.map(({ v, issues }) => `
      <section>
        <h2 class="mb-6 border-b border-slate-200 pb-3 text-xl">${esc(t("archives.volume", { n: v.number, year: v.year }))}</h2>
        <ul class="grid grid-cols-2 gap-5 sm:grid-cols-3 lg:grid-cols-5">${issues.map((i) => `
          <li><a href="#issue-${i.id}" class="group block">
            <div class="rounded-xl">${issueCover(i)}</div>
            <p class="mt-3 text-sm font-semibold text-slate-900">${esc(i.is_special ? t("archives.special") + " " + i.number : t("archives.issue", { n: i.number }))}</p>
            ${tr(i.title) ? `<p class="text-xs text-slate-500">${esc(tr(i.title))}</p>` : ""}
            <p class="text-xs text-slate-500">${esc(fmtDate(i.published_at))}</p>
          </a></li>`).join("")}
        </ul>
      </section>`).join("")}
    </div>
  </div>`;
}

/* ---------------------------------------------------------- public views */
function articleList(list) {
  if (!list.length) return `<p class="text-slate-500">${esc(t("issue.empty"))}</p>`;
  return `<ul class="divide-y divide-slate-200">${list.map((a) => {
    const sec = by("sections", a.section_id);
    const r = range(a.first_page, a.last_page);
    return `<li class="py-4">
      ${sec ? `<p class="mb-1 text-xs font-medium text-accent">${esc(tr(sec.title))}</p>` : ""}
      <a href="#article-${a.id}" class="text-lg font-semibold leading-snug text-slate-900 transition hover:text-brand-700">${esc(trx(a.title_i18n) || a.title)}</a>
      <p class="mt-1 text-sm text-slate-600">${esc(a.authors.map((x) => x.name).join(", "))}</p>
      <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
        ${r ? `<span class="text-slate-500">${esc(t("issue.pages", { range: r }))}</span>` : ""}
        ${a.doi ? `<span class="text-brand-600">DOI: ${esc(a.doi)}</span>` : ""}
        ${a.pdf_path ? `<button data-act="pdf" data-id="${a.id}" class="rounded bg-brand-50 px-2 py-0.5 font-medium text-brand-700 hover:bg-brand-100">PDF</button>` : ""}
      </div>
    </li>`;
  }).join("")}</ul>`;
}
const publishedIssues = () => db.issues.filter((i) => i.status === "published").sort((a, b) => (b.published_at || "").localeCompare(a.published_at || ""));

/* ---------- issue "main topic": most frequent keyword in the issue */
function issueTopic(i) {
  const count = {};
  db.articles.filter((a) => a.issue_id === i.id).forEach((a) => a.keywords.forEach((k) => (count[k] = (count[k] || 0) + 1)));
  return Object.entries(count).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
}

/* ---------- citations */
function citation(a, fmt) {
  const iss = a.issue_id ? by("issues", a.issue_id) : null, v = iss ? by("volumes", iss.volume_id) : null;
  const year = a.published_at ? new Date(a.published_at).getFullYear() : "";
  const r = range(a.first_page, a.last_page), jt = tr(journal().title), names = a.authors.map((x) => x.name);
  const doi = a.doi ? `https://doi.org/${a.doi}` : "";
  if (fmt === "gost") return `${names.join(", ")}. ${a.title} // ${jt}. – ${year}.${v ? ` – Т. ${v.number}` : ""}${iss ? `, № ${iss.number}` : ""}.${r ? ` – С. ${r}` : ""}.${a.doi ? ` – DOI: ${a.doi}` : ""}`;
  if (fmt === "mla") return `${names.join(", ")}. "${a.title}." ${jt}${v ? `, vol. ${v.number}` : ""}${iss ? `, no. ${iss.number}` : ""}, ${year}${r ? `, pp. ${r}` : ""}.${doi ? ` ${doi}.` : ""}`;
  return `${names.join(", ")} (${year}). ${a.title}. ${jt}${v && iss ? `, ${v.number}(${iss.number})` : ""}${r ? `, ${r}` : ""}.${doi ? ` ${doi}` : ""}`;
}

function updateReadBar() {
  const bar = document.getElementById("readbar"), body = document.getElementById("article-body");

const readFile = (file, max = 300 * 1024) => new Promise((ok, bad) => {
  if (!file || !file.size) return ok(null);
  if (file.size > max) return bad(new Error("big"));
  const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(file);
});

/* ---------- 3D tilt on covers (follows the pointer, resets on leave) */
let tiltEl = null;
document.addEventListener("pointermove", (e) => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const el = e.target.closest?.(".tilt");
  if (tiltEl && tiltEl !== el) { tiltEl.style.transform = ""; tiltEl.style.boxShadow = ""; }
  tiltEl = el;
  if (!el) return;
  const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  el.style.transform = `perspective(700px) rotateY(${x * 18}deg) rotateX(${-y * 18}deg) scale(1.03)`;
  el.style.boxShadow = `${-x * 24}px ${24 - y * 10}px 40px -14px rgb(var(--b600) / 0.45)`;
});

function countryOf(aff) {
  const raw = (aff || "").split(",").pop().trim();
  if (!raw) return null;
  const low = raw.toLowerCase().replace(/[ʻʼ‘’`]/g, "'");
  for (const [code, c] of Object.entries(COUNTRIES)) if (c.a.includes(low)) return { key: code, label: c[S.lang] };
  return { key: low, label: raw };
}
/* ---------- figures computed from the journal's own data */
function journalNumbers() {
  const pub = db.articles.filter((a) => a.status === "published");
  const countries = new Set();
  pub.forEach((a) => a.authors.forEach((au) => { const c = countryOf(au.affiliation); if (c) countries.add(c.key); }));
  const decided = ["accepted", "rejected", "revision_required"];
  const days = [];
  db.submissions.forEach((s) => {
    const ev = db.submission_events.filter((e) => e.submission_id === s.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const start = ev.find((e) => e.to_status === "submitted"), end = ev.find((e) => decided.includes(e.to_status));
    if (start && end) days.push((new Date(end.created_at) - new Date(start.created_at)) / 864e5);
  });
  const finals = db.submissions.filter((s) => ["accepted", "published", "rejected"].includes(s.status));
  const acc = finals.filter((s) => s.status !== "rejected").length;
  return [
    [pub.length, "", t("nArticles")],
    [countries.size, "", t("nCountries")],
    [days.length ? Math.round(days.reduce((a, b) => a + b, 0) / days.length) : 0, "", t("nDays")],
    [finals.length ? Math.round((acc / finals.length) * 100) : 0, "%", t("nRate")],
  ];
}

/* ---------- count-up animation for the numbers, once, when they scroll into view */
function animateCounts() {
  const els = document.querySelectorAll("[data-count]");
  if (!els.length || matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const el = e.target, to = Number(el.dataset.count), t0 = performance.now();
    const step = (now) => { const p = Math.min((now - t0) / 1400, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    el.textContent = "0"; requestAnimationFrame(step);
  }), { threshold: 0.6 });
  els.forEach((el) => io.observe(el));
}

function barChart(rows, { suffix = "" } = {}) {

    ${rows.map(([l, v], i) => { const h = (v / max) * (H - 20), x = pad + i * bw + bw * 0.22, w = bw * 0.56; return `
      <rect class="chart-bar" x="${x}" y="${H - h}" width="${w}" height="${h}" rx="6" fill="url(#gbar)" style="animation-delay:${i * 70}ms"/>
      <text x="${x + w / 2}" y="${H - h - 7}" text-anchor="middle" font-size="12" fill="rgb(var(--s800))">${v}${suffix}</text>
      <text x="${x + w / 2}" y="${H + 18}" text-anchor="middle" font-size="11" fill="rgb(var(--s500))">${esc(l)}</text>`; }).join("")}
    <defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(var(--b600))"/><stop offset="1" stop-color="rgb(var(--b600))" stop-opacity="0.25"/></linearGradient></defs>

function setStep(form, n) {

function validStep(form) {
  const panel = form.querySelector(`[data-step="${form.dataset.cur}"]`);
  for (const el of panel.querySelectorAll("input,textarea,select")) {
    if (!el.checkValidity()) {
      if (el.type === "file") { toast(t("submit.file")); document.querySelector('label[for="file"]')?.focus?.(); return false; }
      el.reportValidity(); return false;
    }
  }
  return true;
}

/* --------------------------------------------------------------- router */
const PREFIX = [
  ["admin-member-", viewAdminMember, "staff"], ["admin-article-", viewAdminArticle, "staff"], ["admin-page-", viewAdminPage, "staff"], ["admin-sub-", viewAdminSub, "staff"],
  ["admin-newsitem-", viewAdminNewsItem, "staff"], ["news-", viewNewsItem], ["article-", viewArticle], ["issue-", viewIssue], ["page-", viewPage], ["mysub-", viewMySub, "user"], ["review-", viewReview, "user"],
];
const EXACT = {
  home: viewHome, news: viewNews, "admin-news": [viewAdminNews, "staff"], archives: viewArchives, board: viewBoard, search: viewSearch,
  login: () => viewAuth("login"), register: () => viewAuth("register"),
  dashboard: [viewDashboard, "user"], submit: [viewSubmit, "user"],
  admin: [viewAdmin, "staff"], "admin-submissions": [viewAdminSubs, "staff"], "admin-issues": [viewAdminIssues, "staff"],
  "admin-articles": [viewAdminArticles, "staff"], "admin-users": [viewAdminUsers, "staff"], "admin-pages": [viewAdminPages, "staff"], "admin-board": [viewAdminBoard, "staff"], "admin-settings": [viewAdminSettings, "staff"],
};
function route() {
  let h = decodeURIComponent(location.hash.slice(1)) || "home";
  if (h === "current") { const c = publishedIssues()[0]; h = c ? "issue-" + c.id : "archives"; }
  let fn, need, arg;
  if (EXACT[h]) { const e = EXACT[h]; [fn, need] = Array.isArray(e) ? e : [e]; }
  else for (const [p, f, n] of PREFIX) if (h.startsWith(p)) { fn = f; need = n; arg = h.slice(p.length); break; }
  S.route = h;
  if (!fn) return notFound();
  if (need && !me()) { S.next = h; toast(t("needLogin")); return viewAuth("login"); }
  if (need === "staff" && !isStaff()) return viewDashboard();
  return fn(arg);
}
// Things that need the DOM after each render: scroll story on the home page.
function afterRender() {
  updateReadBar(); tickCountdown(); animateCounts();
  const steps = document.querySelectorAll(".step");
  if (!steps.length) return;
  if (!("IntersectionObserver" in window)) return steps.forEach((s) => s.classList.add("is-on"));
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-on"); io.unobserve(e.target); } }), { threshold: 0.4 });
  steps.forEach((s) => io.observe(s));
}
function render() {
  document.documentElement.lang = S.lang;
  const html = route();
  document.getElementById("app").innerHTML = layout(html);
  const r = S.route || "";
  Scene.setMode(r === "home" ? "star" : /^(article-|page-)/.test(r) ? "book" : r === "archives" || r.startsWith("issue-") ? "stack" : r === "board" ? "globe" : "field");
  if (render.last !== r) { document.getElementById("page")?.classList.add("page-enter"); render.last = r; }
  afterRender();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

});
document.addEventListener("change", (e) => {
  if (e.target.dataset.change === "lang") { S.lang = e.target.value; save(); render(); }
  if (e.target.dataset.change === "fileName") { const n = document.getElementById("file-name"); if (n) n.textContent = e.target.files[0]?.name || t("submit.fileHint"); }
});
applyTheme();
/*__SCENE__*/
Scene.setTheme(S.theme === "light");

render();
</script>
</body>
