function t(key, vars = {}) {
  let s = key.split(".").reduce((o, p) => (o == null ? o : o[p]), MESSAGES[S.lang]);
  if (s == null) s = EXTRA[S.lang][key] ?? key;
  for (const [a, b] of Object.entries(vars)) s = s.split("{" + a + "}").join(b);
  return s;
}
const tr = (o) => (o ? o[S.lang] || o.uz || o.en || o.ru || "" : "");
const trx = (o) => (o && o[S.lang]) || "";

function fmtDate(d) {
  if (!d) return "";
  if (S.lang === "uz") {
    const m = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
    const x = new Date(d);
    return `${x.getDate()}-${m[x.getMonth()]}, ${x.getFullYear()}`;
  }
  const tag = S.lang === "ru" ? "ru-RU" : "en-GB";
  try { return new Intl.DateTimeFormat(tag, { year: "numeric", month: "long", day: "numeric" }).format(new Date(d)); } catch (e) { return d.slice(0, 10); }
}

}

}
// A generated tile-pattern cover for each issue, so the archive reads like a shelf.
function issueCover(i, size = "md") {
  const v = by("volumes", i.volume_id);
  const hues = [["#0a1d5c", "#3cc8bb"], ["#123a63", "#e8b13a"], ["#0b2c4f", "#79dfd5"], ["#1b1f5e", "#e8b13a"]];
  const [bg, fg] = i.is_special ? ["#2a1846", "#e8b13a"] : hues[(i.number + (v?.number || 0)) % hues.length];
  const id = "p" + i.id.replace(/[^a-z0-9]/gi, "");
  const big = size === "lg";
  const topic = issueTopic(i);
  return `<div class="tilt relative aspect-[3/4] w-full overflow-hidden rounded-xl ring-1 ring-white/10" style="background:${bg}">

      <defs><pattern id="${id}" width="44" height="44" patternUnits="userSpaceOnUse">

          <rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/>
          <path d="M0 22h6M38 22h6M22 0v6M22 38v6"/></g></pattern></defs>

    <div class="absolute inset-x-0 bottom-0 ${big ? "p-6" : "p-4"}">
      <p class="font-serif ${big ? "text-5xl" : "text-3xl"} font-light leading-none" style="color:${fg}">${i.is_special ? "S" + i.number : i.number}</p>
      <p class="mt-2 text-xs text-[#cdd5e8]">${esc(v ? t("archives.volume", { n: v.number, year: v.year }) : "")}</p>
    </div>
  </div>`;
}

/* ---------- issue "main topic": most frequent keyword in the issue */
function issueTopic(i) {
  const count = {};
  db.articles.filter((a) => a.issue_id === i.id).forEach((a) => a.keywords.forEach((k) => (count[k] = (count[k] || 0) + 1)));
  return Object.entries(count).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
}

/* ---------- citations */
function citation(a, fmt) {
  const iss = a.issue_id ? by("issues", a.issue_id) : null, v = iss ? by("volumes", iss.volume_id) : null;
  const year = a.published_at ? new Date(a.published_at).getFullYear() : "";
  const r = range(a.first_page, a.last_page), jt = tr(journal().title), names = a.authors.map((x) => x.name);
  const doi = a.doi ? `https://doi.org/${a.doi}` : "";
  if (fmt === "gost") return `${names.join(", ")}. ${a.title} // ${jt}. – ${year}.${v ? ` – Т. ${v.number}` : ""}${iss ? `, № ${iss.number}` : ""}.${r ? ` – С. ${r}` : ""}.${a.doi ? ` – DOI: ${a.doi}` : ""}`;
  if (fmt === "mla") return `${names.join(", ")}. "${a.title}." ${jt}${v ? `, vol. ${v.number}` : ""}${iss ? `, no. ${iss.number}` : ""}, ${year}${r ? `, pp. ${r}` : ""}.${doi ? ` ${doi}.` : ""}`;
  return `${names.join(", ")} (${year}). ${a.title}. ${jt}${v && iss ? `, ${v.number}(${iss.number})` : ""}${r ? `, ${r}` : ""}.${doi ? ` ${doi}` : ""}`;
}

/* ---------- 3D tilt on covers (follows the pointer, resets on leave) */
let tiltEl = null;
document.addEventListener("pointermove", (e) => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const el = e.target.closest?.(".tilt");
  if (tiltEl && tiltEl !== el) { tiltEl.style.transform = ""; tiltEl.style.boxShadow = ""; }
  tiltEl = el;
  if (!el) return;
  const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  el.style.transform = `perspective(700px) rotateY(${x * 18}deg) rotateX(${-y * 18}deg) scale(1.03)`;
  el.style.boxShadow = `${-x * 24}px ${24 - y * 10}px 40px -14px rgb(var(--b600) / 0.45)`;
});

function countryOf(aff) {
  const raw = (aff || "").split(",").pop().trim();
  if (!raw) return null;
  const low = raw.toLowerCase().replace(/[ʻʼ‘’`]/g, "'");
  for (const [code, c] of Object.entries(COUNTRIES)) if (c.a.includes(low)) return { key: code, label: c[S.lang] };
  return { key: low, label: raw };
}
/* ---------- figures computed from the journal's own data */
function journalNumbers() {
  const pub = db.articles.filter((a) => a.status === "published");
  const countries = new Set();
  pub.forEach((a) => a.authors.forEach((au) => { const c = countryOf(au.affiliation); if (c) countries.add(c.key); }));
  const decided = ["accepted", "rejected", "revision_required"];
  const days = [];
  db.submissions.forEach((s) => {
    const ev = db.submission_events.filter((e) => e.submission_id === s.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const start = ev.find((e) => e.to_status === "submitted"), end = ev.find((e) => decided.includes(e.to_status));
    if (start && end) days.push((new Date(end.created_at) - new Date(start.created_at)) / 864e5);
  });
  const finals = db.submissions.filter((s) => ["accepted", "published", "rejected"].includes(s.status));
  const acc = finals.filter((s) => s.status !== "rejected").length;
  return [
    [pub.length, "", t("nArticles")],
    [countries.size, "", t("nCountries")],
    [days.length ? Math.round(days.reduce((a, b) => a + b, 0) / days.length) : 0, "", t("nDays")],
    [finals.length ? Math.round((acc / finals.length) * 100) : 0, "%", t("nRate")],
  ];
}

/* ---------- count-up animation for the numbers, once, when they scroll into view */
function animateCounts() {
  const els = document.querySelectorAll("[data-count]");
  if (!els.length || matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const el = e.target, to = Number(el.dataset.count), t0 = performance.now();
    const step = (now) => { const p = Math.min((now - t0) / 1400, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    el.textContent = "0"; requestAnimationFrame(step);
  }), { threshold: 0.6 });
  els.forEach((el) => io.observe(el));
}

/* ---------- admin charts (plain SVG, drawn from the data) */
function barChart(rows, { suffix = "" } = {}) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  const W = 520, H = 200, pad = 28, bw = (W - pad) / rows.length;
  return `<svg viewBox="0 0 ${W} ${H + 28}" class="w-full" role="img" aria-label="${esc(rows.map((r) => `${r[0]}: ${r[1]}`).join(", "))}">
    ${[0.25, 0.5, 0.75, 1].map((f) => `<line x1="${pad}" x2="${W}" y1="${H - f * (H - 20)}" y2="${H - f * (H - 20)}" stroke="rgb(var(--s200))" stroke-dasharray="3 4"/>`).join("")}
    ${rows.map(([l, v], i) => { const h = (v / max) * (H - 20), x = pad + i * bw + bw * 0.22, w = bw * 0.56; return `
      <rect class="chart-bar" x="${x}" y="${H - h}" width="${w}" height="${h}" rx="6" fill="url(#gbar)" style="animation-delay:${i * 70}ms"/>
      <text x="${x + w / 2}" y="${H - h - 7}" text-anchor="middle" font-size="12" fill="rgb(var(--s800))">${v}${suffix}</text>
      <text x="${x + w / 2}" y="${H + 18}" text-anchor="middle" font-size="11" fill="rgb(var(--s500))">${esc(l)}</text>`; }).join("")}
    <defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(var(--b600))"/><stop offset="1" stop-color="rgb(var(--b600))" stop-opacity="0.25"/></linearGradient></defs>
  </svg>`;
}
function hBars(rows) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return `<ul class="space-y-3">${rows.map(([l, v], i) => `<li class="text-sm">
    <div class="mb-1 flex justify-between"><span class="text-slate-700">${esc(l)}</span><span class="tabular-nums text-slate-500">${v}</span></div>
    <div class="h-2 overflow-hidden rounded-full bg-slate-200"><div class="chart-hbar h-full rounded-full" style="width:${(v / max) * 100}%;background:linear-gradient(90deg, rgb(var(--acc)), rgb(var(--b600)));animation-delay:${i * 80}ms"></div></div>
  </li>`).join("")}</ul>`;
}
function donut(rows) {
  const total = rows.reduce((a, r) => a + r[1], 0) || 1;
  const colors = ["#38bdf8", "#818cf8", "#fbbf24", "#fb923c", "#34d399", "#f87171", "rgb(var(--b600))", "rgb(var(--s400))"];
  let acc = 0;
  const C = 2 * Math.PI * 52;
  return `<div class="flex flex-wrap items-center gap-6">
    <svg viewBox="0 0 140 140" class="h-36 w-36 -rotate-90" role="img" aria-label="${esc(rows.map((r) => `${r[0]}: ${r[1]}`).join(", "))}">
      <circle cx="70" cy="70" r="52" fill="none" stroke="rgb(var(--s200))" stroke-width="16"/>
      ${rows.map(([, v], i) => { const len = (v / total) * C, el = `<circle cx="70" cy="70" r="52" fill="none" stroke="${colors[i % colors.length]}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}"/>`; acc += len; return el; }).join("")}
    </svg>
    <ul class="space-y-1.5 text-sm">${rows.map(([l, v], i) => `<li class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full" style="background:${colors[i % colors.length]}" aria-hidden="true"></span><span class="text-slate-700">${esc(l)}</span><span class="tabular-nums text-slate-500">${v}</span></li>`).join("")}</ul>
  </div>`;
}

/* --------------------------------------------------------------- router */
const PREFIX = [
  ["admin-member-", viewAdminMember, "staff"], ["admin-article-", viewAdminArticle, "staff"], ["admin-page-", viewAdminPage, "staff"], ["admin-sub-", viewAdminSub, "staff"],
  ["admin-newsitem-", viewAdminNewsItem, "staff"], ["news-", viewNewsItem], ["article-", viewArticle], ["issue-", viewIssue], ["page-", viewPage], ["mysub-", viewMySub, "user"], ["review-", viewReview, "user"],
];
const EXACT = {
  home: viewHome, news: viewNews, "admin-news": [viewAdminNews, "staff"], archives: viewArchives, board: viewBoard, search: viewSearch,
  login: () => viewAuth("login"), register: () => viewAuth("register"),
  dashboard: [viewDashboard, "user"], submit: [viewSubmit, "user"],
  admin: [viewAdmin, "staff"], "admin-submissions": [viewAdminSubs, "staff"], "admin-issues": [viewAdminIssues, "staff"],
  "admin-articles": [viewAdminArticles, "staff"], "admin-users": [viewAdminUsers, "staff"], "admin-pages": [viewAdminPages, "staff"], "admin-board": [viewAdminBoard, "staff"], "admin-settings": [viewAdminSettings, "staff"],
};
function route() {
  let h = decodeURIComponent(location.hash.slice(1)) || "home";
  if (h === "current") { const c = publishedIssues()[0]; h = c ? "issue-" + c.id : "archives"; }
  let fn, need, arg;
  if (EXACT[h]) { const e = EXACT[h]; [fn, need] = Array.isArray(e) ? e : [e]; }
  else for (const [p, f, n] of PREFIX) if (h.startsWith(p)) { fn = f; need = n; arg = h.slice(p.length); break; }
  S.route = h;
  if (!fn) return notFound();
  if (need && !me()) { S.next = h; toast(t("needLogin")); return viewAuth("login"); }
  if (need === "staff" && !isStaff()) return viewDashboard();
  return fn(arg);
}
// Things that need the DOM after each render: scroll story on the home page.
function afterRender() {
  updateReadBar(); tickCountdown(); animateCounts();
  const steps = document.querySelectorAll(".step");
  if (!steps.length) return;
  if (!("IntersectionObserver" in window)) return steps.forEach((s) => s.classList.add("is-on"));
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-on"); io.unobserve(e.target); } }), { threshold: 0.4 });
  steps.forEach((s) => io.observe(s));
}
function render() {
  document.documentElement.lang = S.lang;
  const html = route();
  document.getElementById("app").innerHTML = layout(html);
  const r = S.route || "";
  Scene.setMode(r === "home" ? "star" : /^(article-|page-)/.test(r) ? "book" : r === "archives" || r.startsWith("issue-") ? "stack" : r === "board" ? "globe" : "field");
  if (render.last !== r) { document.getElementById("page")?.classList.add("page-enter"); render.last = r; }
  afterRender();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  markAll() { db.notifications.filter((n) => n.user_id === S.uid).forEach((n) => (n.read = true)); save(); render(); },
  openNotif(d) { const n = by("notifications", d.id); n.read = true; S.bellOpen = false; save(); go(n.link); },

/* ---------------------------------------------------------------- 3D scene

const Scene = (() => {
  const canvas = document.getElementById("scene");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const noop = { setMode() {}, setTheme() {} };
  if (!window.THREE || !canvas) return noop;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, small ? 1.5 : 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 0, 9);

  const N = small ? 4500 : 9000;
  const rand = (a, b) => a + Math.random() * (b - a);
  const PAL = {
    dark: { gold: "#e8b13a", turq: "#3cc8bb", ivory: "#f6f2e7", lapis: "#5a7ee0" },
    light: { gold: "#b07d10", turq: "#0f8f84", ivory: "#1a2a5c", lapis: "#3557b8" },
  };
  const role = new Uint8Array(N); // 0 gold, 1 turq, 2 ivory, 3 lapis
  const sizes = new Float32Array(N), seeds = new Float32Array(N);

  /* ---------- shape builders: each fills a Float32Array of N*3 */

  const poly = (n, f) => Array.from({ length: n }, (_, k) => f(k));
  const starPoly = poly(16, (k) => { const a = (k * Math.PI) / 8 + Math.PI / 8, r = k % 2 === 0 ? R : R * 0.7654; return [Math.cos(a) * r, Math.sin(a) * r]; });
  const octa = poly(8, (k) => { const a = (k * Math.PI) / 4; return [Math.cos(a) * R * 0.52, Math.sin(a) * R * 0.52]; });
  const rosette = poly(16, (k) => { const a = (k * Math.PI) / 8, r = k % 2 === 0 ? R * 0.34 : R * 0.22; return [Math.cos(a) * r, Math.sin(a) * r]; });
  const onPoly = (pl, t) => { const n = pl.length, f = t * n, i = Math.floor(f) % n, u = f - Math.floor(f), a = pl[i], b = pl[(i + 1) % n]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; };

  const star = new Float32Array(N * 3);

    const r = Math.random(); let x, y, z;
    if (r < 0.42) { [x, y] = onPoly(starPoly, Math.random()); z = (Math.random() < 0.5 ? -1 : 1) * 0.18 + rand(-0.04, 0.04); role[i] = 0; sizes[i] = rand(1.2, 2.4); }
    else if (r < 0.6) {
      const sq = Math.random() < 0.5 ? 0 : Math.PI / 4, tt = Math.random() * 4, side = Math.floor(tt), u = tt - side, h = R * 0.62;
      const c = [[-h, -h], [h, -h], [h, h], [-h, h]], a = c[side], b = c[(side + 1) % 4];

    const wide = w >= 1024;
    placement = {
      star: wide ? { x: 3.3, y: 0.1, s: 1, o: 1 } : { x: 0, y: w < 640 ? 2.6 : 1.8, s: w < 640 ? 0.62 : 0.8, o: 0.42 },
      side: wide ? { x: 3.7, y: -0.3, s: 0.85, o: 0.34 } : { x: 0, y: 2.8, s: 0.6, o: 0.18 },
      field: { x: 0, y: 0, s: 1, o: 0.38 },
    };
  }
  layoutGroup();
  window.addEventListener("resize", layoutGroup);

  function setMode(m) {
    if (!SHAPES[m] || m === mode) return;
    mode = m; target = SHAPES[m];
    if (reduce) { pos.set(target); geo.attributes.position.needsUpdate = true; }
  }

  /* ---------- loop */
  const clock = new THREE.Clock();
  let scrollY = 0, running = true, T = 0;
  window.addEventListener("scroll", () => (scrollY = window.scrollY), { passive: true });
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running && !reduce) { clock.getDelta(); requestAnimationFrame(frame); }
  });
  const inv = new THREE.Matrix4();
  function frame() {
    if (!running) return;
    const dt = Math.min(clock.getDelta(), 0.1);
    T += dt; const t = T;
    const isStar = mode === "star";
    // time-based easing: same speed at 30 fps or 144 fps
    const k = 1 - Math.exp(-dt * (isStar ? Math.min(0.9 + t * 0.6, 3.6) : 2.1));

    // pointer position in the group's local space (for the push-away effect)
    let mx = 1e9, my = 1e9;
    if (mouse.active && mode !== "field") {
      ray.setFromCamera(mouse.ndc, camera);
      if (ray.ray.intersectPlane(plane, hit)) {
        inv.copy(group.matrixWorld).invert();
        mouse.local.copy(hit).applyMatrix4(inv); mx = mouse.local.x; my = mouse.local.y;
      }
    }
    const RAD = 1.1, RAD2 = RAD * RAD;
    const wob = isStar ? 0.025 : mode === "field" ? 0.35 : 0.04;
    for (let i = 0; i < N; i++) {
      const j = i * 3, sd = seeds[i];
      let tx = target[j] + Math.sin(t * 0.6 + sd) * wob;
      let ty = target[j + 1] + Math.cos(t * 0.5 + sd * 1.3) * wob;
      const tz = target[j + 2] + Math.sin(t * 0.4 + sd * 0.7) * wob;
      const dx = pos[j] - mx, dy = pos[j + 1] - my, d2 = dx * dx + dy * dy;
      if (d2 < RAD2) { const d = Math.sqrt(d2) + 1e-4, f = (RAD - d) * 1.6; tx += (dx / d) * f; ty += (dy / d) * f; }
      pos[j] += (tx - pos[j]) * k; pos[j + 1] += (ty - pos[j + 1]) * k; pos[j + 2] += (tz - pos[j + 2]) * k;
    }
    geo.attributes.position.needsUpdate = true;
    for (let p = 0; p < pairs.length; p++) { const s = pairs[p] * 3; linePos[p * 3] = pos[s]; linePos[p * 3 + 1] = pos[s + 1]; linePos[p * 3 + 2] = pos[s + 2]; }
    lineGeo.attributes.position.needsUpdate = true;

    mouse.sx += (mouse.x - mouse.sx) * 0.05; mouse.sy += (mouse.y - mouse.sy) * 0.05;
    const pl = isStar ? placement.star : mode === "field" ? placement.field : placement.side;
    const fade = isStar ? Math.min(scrollY / innerHeight, 1) : 0;
    group.position.x += (pl.x - group.position.x) * 0.05;
    group.position.y += (pl.y + fade * 1.6 - group.position.y) * 0.05;
    group.scale.setScalar(group.scale.x + (pl.s * (1 - fade * 0.15) - group.scale.x) * 0.05);
    const spin = mode === "globe" ? t * 0.15 : 0;
    group.rotation.z = isStar ? t * 0.05 : 0;
    group.rotation.y = mouse.sx * 0.9 + Math.sin(t * 0.3) * 0.12 + spin + (mode === "book" ? -0.35 : mode === "stack" ? -0.5 : 0);
    group.rotation.x = -mouse.sy * 0.7 + Math.cos(t * 0.25) * 0.08 + (mode === "book" ? -0.55 : 0);
    const og = pl.o * (1 - fade * 0.55) * (light ? 0.85 : 1);
    mat.uniforms.uOpacity.value += (og - mat.uniforms.uOpacity.value) * 0.05;
    const lineGoal = isStar ? (light ? 0.22 : 0.16) * (1 - fade) * Math.min(t / 3, 1) : 0;
    lineMat.opacity += (lineGoal - lineMat.opacity) * 0.05;
    renderer.render(scene, camera);
    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) { pos.set(star); geo.attributes.position.needsUpdate = true; group.position.set(placement.star.x, placement.star.y, 0); }
  frame();
  return {
    setMode: (m) => { setMode(m); if (reduce) frame(); },
    setTheme: (l) => { setTheme(l); if (reduce) frame(); },
  };
})();

Scene.setTheme(S.theme === "light");

render();
</script>
</body>
</html>
